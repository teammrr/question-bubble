<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IG Question Bubble</title>
  <style>
    :root {
      --screen: #04f404;
      --header: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --scale: 1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--screen);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
    }

    body.show-cursor { cursor: default; }

    /* ---------- Sticker ---------- */
    #stage { transform: scale(var(--scale)); }

    .sticker {
      position: relative;
      width: 320px;
      border-radius: 22px;
      background: #fff;
      margin-top: 30px; /* room for the avatar */
      animation: pop-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .sticker.shadow { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
    .sticker.leaving { animation: pop-out 0.3s ease-in both; }
    .sticker.bump { animation: bump 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .avatar {
      position: absolute;
      top: 0;
      left: 50%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 3px solid #fff;
      background: #dbdbdb center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 22px;
      z-index: 2;
    }

    .header {
      background: var(--header);
      border-radius: 22px 22px 0 0;
      padding: 40px 22px 18px;
      color: #fff;
      text-align: center;
    }

    .body {
      padding: 16px 18px 18px;
      text-align: center;
    }

    .field {
      outline: none;
      word-wrap: break-word;
      white-space: pre-wrap;
      min-height: 1.25em;
    }

    #question {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.25;
      caret-color: #fff;
    }

    #answer {
      font-size: 18px;
      font-weight: 500;
      line-height: 1.3;
      color: #262626;
      caret-color: #262626;
      border-radius: 12px;
      padding: 12px 14px;
      transition: background-color 0.2s ease;
    }

    /* Empty answer looks like the real "Type something..." input */
    #answer:empty { background: #efefef; }
    #answer:empty::before {
      content: attr(data-placeholder);
      color: #8e8e8e;
      font-weight: 400;
    }
    #question:empty::before {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.7);
    }

    /* Hide caret on the field that isn't being typed in, and while idle */
    .field:not(:focus) { caret-color: transparent; }
    body.hide-caret .field { caret-color: transparent !important; }

    @keyframes pop-in {
      0%   { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes pop-out {
      to { transform: scale(0.6); opacity: 0; }
    }
    @keyframes bump {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    /* ---------- Settings panel (hidden while recording) ---------- */
    #panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 260px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(20, 20, 20, 0.92);
      color: #eee;
      font-size: 13px;
      display: none;
      flex-direction: column;
      gap: 12px;
      cursor: default;
      z-index: 10;
    }
    #panel.open { display: flex; }
    #panel h2 { font-size: 14px; }
    #panel label { display: flex; flex-direction: column; gap: 6px; }
    #panel .row { flex-direction: row; align-items: center; gap: 8px; }
    #panel input[type="range"] { width: 100%; }
    #panel button {
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: #eee;
      cursor: pointer;
    }
    #panel button:hover { background: #444; }
    #panel kbd {
      background: #333;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
    }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .swatch.active { border-color: #fff; }
    .help { color: #aaa; line-height: 1.6; }

    #hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 13px;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #hint.gone { opacity: 0; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <template id="sticker-tpl">
    <div class="sticker">
      <div class="avatar"></div>
      <div class="header">
        <div id="question" class="field" contenteditable="true" spellcheck="false" data-placeholder="Ask me a question"></div>
      </div>
      <div class="body">
        <div id="answer" class="field" contenteditable="true" spellcheck="false" data-placeholder="Type something..."></div>
      </div>
    </div>
  </template>

  <div id="panel">
    <h2>IG Question Bubble</h2>

    <label>Header color
      <div class="swatches" id="swatches"></div>
    </label>

    <label>Avatar
      <div class="row">
        <input type="file" id="avatar-file" accept="image/*" hidden />
        <button id="avatar-upload">Upload photo</button>
        <button id="avatar-clear">Clear</button>
      </div>
    </label>

    <label>Background (green screen)
      <div class="row">
        <input type="color" id="screen-color" />
        <span id="screen-hex"></span>
      </div>
    </label>

    <label>Size <input type="range" id="scale" min="0.6" max="2.5" step="0.05" /></label>

    <label class="row"><input type="checkbox" id="shadow" /> Drop shadow</label>
    <label class="row"><input type="checkbox" id="keep-question" /> Keep question on reset</label>

    <div class="help">
      <kbd>Enter</kbd> question → answer<br />
      <kbd>Enter</kbd> on answer → pop<br />
      <kbd>Esc</kbd> new sticker<br />
      <kbd>Shift</kbd>+<kbd>Enter</kbd> new line<br />
      <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>.</kbd> toggle this panel
    </div>
  </div>

  <div id="hint">Press Ctrl/⌘ + . for settings</div>

  <script>
    const HEADERS = [
      "linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)",
      "linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045)",
      "linear-gradient(135deg, #4f5bd5, #962fbf)",
      "#262626",
      "#3897f0",
      "#8a3ab9",
      "#ed4956",
      "#fd8d32",
      "#58c322",
    ];

    const DEFAULTS = {
      header: HEADERS[0],
      avatar: "",
      screen: "#04f404",
      scale: 1.3,
      shadow: false,
      keepQuestion: true,
      question: "",
    };

    const state = { ...DEFAULTS, ...load() };

    const stage = document.getElementById("stage");
    const tpl = document.getElementById("sticker-tpl");
    const panel = document.getElementById("panel");
    let sticker, question, answer;

    function load() {
      try { return JSON.parse(localStorage.getItem("ig-question-bubble") || "{}"); }
      catch { return {}; }
    }

    function save() {
      try { localStorage.setItem("ig-question-bubble", JSON.stringify(state)); }
      catch { /* storage unavailable (e.g. private window) */ }
    }

    function applySettings() {
      const root = document.documentElement.style;
      root.setProperty("--screen", state.screen);
      root.setProperty("--header", state.header);
      root.setProperty("--scale", state.scale);
      if (sticker) {
        sticker.classList.toggle("shadow", state.shadow);
        const av = sticker.querySelector(".avatar");
        av.style.backgroundImage = state.avatar ? `url(${state.avatar})` : "";
      }
      document.querySelectorAll(".swatch").forEach((s) =>
        s.classList.toggle("active", s.dataset.value === state.header)
      );
      save();
    }

    function focusEnd(el) {
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // contenteditable leaves a stray <br> when emptied, which breaks :empty
    function tidy(el) {
      if (el.textContent === "") el.innerHTML = "";
    }

    function newSticker() {
      const node = tpl.content.firstElementChild.cloneNode(true);
      stage.replaceChildren(node);
      sticker = node;
      question = node.querySelector("#question");
      answer = node.querySelector("#answer");

      if (state.keepQuestion && state.question) question.textContent = state.question;

      for (const el of [question, answer]) {
        el.addEventListener("input", () => {
          tidy(el);
          if (el === question) { state.question = question.textContent; save(); }
        });
        // Paste as plain text only
        el.addEventListener("paste", (e) => {
          e.preventDefault();
          document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
        });
      }

      applySettings();
      focusEnd(question.textContent ? answer : question);
    }

    function resetSticker() {
      if (!sticker) return newSticker();
      document.body.classList.remove("hide-caret");
      sticker.classList.remove("bump");
      sticker.classList.add("leaving");
      setTimeout(newSticker, 300);
    }

    function bump() {
      sticker.classList.remove("bump");
      void sticker.offsetWidth; // restart animation
      sticker.classList.add("bump");
      document.body.classList.add("hide-caret");
    }

    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === "." || e.code === "Period")) {
        e.preventDefault();
        panel.classList.toggle("open");
        document.body.classList.toggle("show-cursor", panel.classList.contains("open"));
        return;
      }

      if (panel.contains(e.target)) return;

      if (e.key === "Escape") {
        e.preventDefault();
        resetSticker();
        return;
      }

      // Any typing after a "pop" resumes editing the answer
      if (document.body.classList.contains("hide-caret") && e.key.length === 1) {
        document.body.classList.remove("hide-caret");
        focusEnd(answer);
      }

      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (e.target === question) {
          if (question.textContent.trim()) focusEnd(answer);
        } else if (e.target === answer) {
          if (answer.textContent.trim()) bump();
        }
      }
    });

    // Keep focus inside the sticker so recording never loses the caret
    document.addEventListener("mousedown", (e) => {
      if (!panel.contains(e.target) && !sticker.contains(e.target)) e.preventDefault();
    });

    // ---------- Panel wiring ----------
    const swatches = document.getElementById("swatches");
    for (const value of HEADERS) {
      const s = document.createElement("div");
      s.className = "swatch";
      s.dataset.value = value;
      s.style.background = value;
      s.addEventListener("click", () => { state.header = value; applySettings(); });
      swatches.append(s);
    }

    const fileInput = document.getElementById("avatar-file");
    document.getElementById("avatar-upload").onclick = () => fileInput.click();
    document.getElementById("avatar-clear").onclick = () => { state.avatar = ""; applySettings(); };
    fileInput.onchange = () => {
      const file = fileInput.files[0];
      if (!file) return;
      // Downscale so it fits in localStorage
      const img = new Image();
      img.onload = () => {
        const size = 160;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        state.avatar = c.toDataURL("image/jpeg", 0.9);
        URL.revokeObjectURL(img.src);
        applySettings();
      };
      img.src = URL.createObjectURL(file);
    };

    const screenColor = document.getElementById("screen-color");
    const screenHex = document.getElementById("screen-hex");
    screenColor.value = state.screen;
    screenHex.textContent = state.screen;
    screenColor.oninput = () => {
      state.screen = screenColor.value;
      screenHex.textContent = state.screen;
      applySettings();
    };

    const scale = document.getElementById("scale");
    scale.value = state.scale;
    scale.oninput = () => { state.scale = Number(scale.value); applySettings(); };

    const shadow = document.getElementById("shadow");
    shadow.checked = state.shadow;
    shadow.onchange = () => { state.shadow = shadow.checked; applySettings(); };

    const keepQuestion = document.getElementById("keep-question");
    keepQuestion.checked = state.keepQuestion;
    keepQuestion.onchange = () => { state.keepQuestion = keepQuestion.checked; save(); };

    setTimeout(() => document.getElementById("hint").classList.add("gone"), 3500);

    newSticker();
  </script>
</body>
</html>
